name: Сборка

# Сборка запускается:
#  - вручную (вкладка Actions → «Сборка» → Run workflow) — пакеты появятся в артефактах запуска;
#  - при отправке тега вида v1.2.3 — пакеты сразу выкладываются в Releases.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1 и новее)
          - runner: macos-15-intel    # старые Mac на Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Тесты
        run: uv run --python 3.11 --with-requirements requirements.txt python -m unittest discover -v tests
      - name: Сборка .app и .dmg
        run: bash packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.runner }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Тесты
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -v tests
      - name: Сборка .exe и .zip
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия в коде совпадает с тегом
        run: |
          code=$(sed -n 's/^ВЕРСИЯ = "\(.*\)"/\1/p' poisk.py)
          [ "v$code" = "$GITHUB_REF_NAME" ] || { echo "В poisk.py версия $code, а тег $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Поиск картинок $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md
